<script>
(function() {
  // Stockage : utilise window.storage dans un artefact Claude (partagé entre utilisateurs),
  // ou un repli sur localStorage du navigateur si l'appli tourne ailleurs (ex: GitHub Pages).
  // Le repli n'est PAS partagé entre appareils/collègues — utile pour un test solo hors Claude.
  const storageAPI = (typeof window !== 'undefined' && window.storage) ? window.storage : {
    async get(key) {
      const raw = localStorage.getItem('sfi-local-' + key);
      if (raw === null) throw new Error('clé introuvable');
      return { key, value: raw };
    },
    async set(key, value) {
      localStorage.setItem('sfi-local-' + key, value);
      return { key, value };
    },
    async delete(key) {
      localStorage.removeItem('sfi-local-' + key);
      return { key, deleted: true };
    },
    async list(prefix) {
      const p = 'sfi-local-' + (prefix || '');
      const keys = Object.keys(localStorage).filter(k => k.startsWith(p)).map(k => k.slice('sfi-local-'.length));
      return { keys, prefix };
    }
  };

  const STORAGE_KEY = 'sfi-data-v1';
  const DEFAULT_TYPES = [
    {label: 'Extincteur', freq: 12, category: 'equipement', rappelDefaut: 6},

  function compressImage(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          const maxDim = 900;
          let w = img.width, h = img.height;
          if (w > maxDim || h > maxDim) {
            if (w >= h) { h = Math.round(h * maxDim / w); w = maxDim; }
            else { w = Math.round(w * maxDim / h); h = maxDim; }
          }
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL('image/jpeg', 0.7));
        };
        img.onerror = () => reject(new Error('image invalide'));
        img.src = e.target.result;
      };
      reader.onerror = () => reject(new Error('lecture impossible'));
      reader.readAsDataURL(file);
    });
  }

  // Ajoute une période (en mois, peut être < 1 pour un contrôle hebdo/court) à une date
  function addFreqPeriod(date, freqMonths) {
    const d = new Date(date);
    if (freqMonths >= 1) {
      d.setMonth(d.getMonth() + Math.round(freqMonths));
    } else {
      d.setDate(d.getDate() + Math.round(freqMonths * 30));
    }
    return d;
  }

  // Libellé lisible d'une périodicité — gère les cycles courts (semaines) et longs (mois)
  function formatFreq(freqMonths, short) {
    if (freqMonths < 1) {
      const weeks = Math.max(1, Math.round(freqMonths * 30 / 7));
      return short ? `${weeks} sem.` : (weeks === 1 ? 'chaque semaine' : `toutes les ${weeks} semaines`);
    }
    return short ? `${freqMonths} mois` : (freqMonths === 1 ? 'tous les mois' : `tous les ${freqMonths} mois`);
  }

  function lastVerif(equipId) {
    const list = db.interventions
      .filter(i => i.equipementId === equipId && i.type === 'verif_ok')
      .sort((a,b) => b.date.localeCompare(a.date));
    return list[0] || null;
  }

  function lastPanneOuverte(equipId) {
    const evs = db.interventions
      .filter(i => i.equipementId === equipId)
      .sort((a,b) => b.date.localeCompare(a.date));
    if (evs.length === 0) return false;
    return evs[0].type === 'panne';
  }

  // Statut d'un équipement — règle unique de rappel (par défaut 6 mois avant échéance),
  // plafonnée à la moitié du cycle pour rester cohérente sur les contrôles courts (hebdo, trimestriel...)
  function statusOf(equip) {
    if (lastPanneOuverte(equip.id)) return 'danger';
    const lv = lastVerif(equip.id);
    if (!lv) return 'warn';
    const freq = equip.freq || 12;
    const due = addFreqPeriod(lv.date, freq);
    const rappelMois = equip.rappelMois != null ? equip.rappelMois : 6;
    const effectiveRappel = Math.min(rappelMois, freq / 2);
    const rappelDate = addFreqPeriod(due, -effectiveRappel);
    const now = new Date();
    if (now > due) return 'danger';
    if (now >= rappelDate) return 'warn';
    return 'ok';
  }

  function statusLabel(s) {
    return s === 'ok' ? 'À jour' : s === 'warn' ? 'À vérifier' : 'En panne / retard';
  }

  // Échéance de contrôle en ms — sert à prioriser (jamais vérifié ou en panne = tout en haut)
  function dueDateMs(equip) {
    if (lastPanneOuverte(equip.id)) return -Infinity;
    const lv = lastVerif(equip.id);
    if (!lv) return -Infinity;
    return addFreqPeriod(lv.date, equip.freq || 12).getTime();
  }

  function fmtDate(iso) {
    const d = new Date(iso);
    return d.toLocaleDateString('fr-FR', {day:'2-digit', month:'short', year:'numeric'});
  }

  function typesWithCounts() {
    return db.types.map(t => {
      if (t.category === 'personnel') {
        const collabs = habCollaboratorsForType(t.label);
        const counts = {ok:0, warn:0, danger:0};
        collabs.forEach(c => counts[habStatus(c.latest)]++);
        return {...t, total: collabs.length, counts};
      }
      const items = db.equipements.filter(e => e.type === t.label && inScope(e.magasin));
      const counts = {ok:0, warn:0, danger:0};
      items.forEach(e => counts[statusOf(e)]++);
      return {...t, total: items.length, counts};
    });
  }

  // ---------- Habilitations personnel (nom, date obtention, date expiration, rappel) ----------

  function habStatus(h) {
    if (!h) return 'warn';
    const exp = new Date(h.dateExpiration);
    const now = new Date();
    const rappelDate = new Date(exp);
    rappelDate.setMonth(rappelDate.getMonth() - (h.rappelMois || 6));
    if (now > exp) return 'danger';
    if (now >= rappelDate) return 'warn';
    return 'ok';
  }

  function habHistory(type, collaborateur) {
    return db.habilitations
      .filter(h => h.type === type && h.collaborateur === collaborateur)
      .sort((a,b) => b.dateObtention.localeCompare(a.dateObtention));
  }

  function habCollaboratorsForType(type) {
    const names = [...new Set(db.habilitations.filter(h => h.type === type && inScope(h.magasin)).map(h => h.collaborateur))];
    return names.map(collaborateur => {
      const hist = habHistory(type, collaborateur);
      return {collaborateur, latest: hist[0], history: hist};
    }).sort((a,b) => a.collaborateur.localeCompare(b.collaborateur));
  }

  function daysUntil(dateIso) {
    return Math.round((new Date(dateIso) - new Date()) / 86400000);
  }

  function addMonthsIso(dateIso, months) {
    const d = new Date(dateIso);
    d.setMonth(d.getMonth() + months);
    return d.toISOString().slice(0,10);
  }

  function escapeHtml(s) {
    return (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

    } else if (state.view === 'statusList' && state.statusFilter) {

  function habLatestRecordsForStore(m) {
    const seen = new Set();
    const out = [];
    db.habilitations.filter(h => h.magasin === m).forEach(h => {
      const key = h.type + '||' + h.collaborateur;
      if (seen.has(key)) return;
      seen.add(key);
      const hist = db.habilitations
        .filter(x => x.type === h.type && x.collaborateur === h.collaborateur && x.magasin === m)
        .sort((a,b) => b.dateObtention.localeCompare(a.dateObtention));
      out.push({type: h.type, collaborateur: h.collaborateur, latest: hist[0]});
    });
    return out;
  }

  function storesWithCounts() {
    return MAGASINS.map(m => {
      const equipItems = db.equipements.filter(e => e.magasin === m);
      const counts = {ok:0, warn:0, danger:0};
      equipItems.forEach(e => counts[statusOf(e)]++);
      const habRecords = habLatestRecordsForStore(m);
      habRecords.forEach(r => counts[habStatus(r.latest)]++);
      return {magasin: m, total: equipItems.length + habRecords.length, counts};
    });
  }

  function renderStoreMenu() {
    const stores = storesWithCounts();
    const grandTotal = {ok:0, warn:0, danger:0};
    stores.forEach(s => { grandTotal.ok += s.counts.ok; grandTotal.warn += s.counts.warn; grandTotal.danger += s.counts.danger; });

    const tileHtml = (s) => {
      const worst = s.counts.danger > 0 ? 'danger' : s.counts.warn > 0 ? 'warn' : 'ok';
      const bits = [];
      if (s.counts.danger) bits.push(`<span class="sfi-type-pill st-danger">${s.counts.danger}</span>`);
      if (s.counts.warn) bits.push(`<span class="sfi-type-pill st-warn">${s.counts.warn}</span>`);
      if (s.counts.ok) bits.push(`<span class="sfi-type-pill st-ok">${s.counts.ok}</span>`);
      return `
        <div class="sfi-type-tile" data-pick-store="${escapeHtml(s.magasin)}">
          <div class="sfi-type-bar st-${s.total ? worst : 'empty'}"></div>
          <div class="sfi-type-main">
            <div class="sfi-type-label">${escapeHtml(s.magasin)}</div>
            <div class="sfi-type-count">${s.total} ${s.total > 1 ? 'éléments suivis' : s.total === 1 ? 'élément suivi' : 'aucun élément'}</div>
          </div>
          <div class="sfi-type-pills">${bits.join('') || (s.total === 0 ? '<span class="sfi-type-pill st-empty">—</span>' : '')}</div>
        </div>`;
    };

    root.innerHTML = `
      <div class="sfi-header">
        <div class="sfi-brand">
          <div class="sfi-brand-mark">${weldomRoofIcon()}</div>
          <div class="sfi-brand-text">
            <h1>Tableau de bord sécurité</h1>
            <p>Weldom · admin</p>
          </div>
        </div>
      </div>
      <div class="sfi-scope-row">
        <span>${escapeHtml(state.session.username)} · admin</span>
        <span>
          <button data-open-categories style="margin-right:12px;">Catégories</button>
          <button data-open-accounts style="margin-right:12px;">Comptes</button>
          <button data-logout>Déconnexion</button>
        </span>
      </div>
      <div class="sfi-stats">
        <div class="sfi-stat st-ok"><b>${grandTotal.ok}</b><span>À jour</span></div>
        <div class="sfi-stat st-warn"><b>${grandTotal.warn}</b><span>À vérifier</span></div>
        <div class="sfi-stat st-danger"><b>${grandTotal.danger}</b><span>Panne/retard</span></div>
      </div>
      <div class="sfi-list" style="position:relative;">
        <div class="sfi-section-label" style="margin-top:0;">Choisis un magasin</div>
        ${stores.map(tileHtml).join('')}
        <div class="sfi-section-label">Ou</div>
        <div class="sfi-type-tile" data-pick-store="TOUS">
          <div class="sfi-type-bar st-ok"></div>
          <div class="sfi-type-main">
            <div class="sfi-type-label">Tous les magasins</div>
            <div class="sfi-type-count">Vue globale, regroupée par magasin</div>
          </div>
        </div>
      </div>
    `;
    root.querySelectorAll('[data-pick-store]').forEach(el => {
      el.onclick = () => {
        state.adminScope = el.getAttribute('data-pick-store');
        state.view = 'types';
        render();
      };
    });
    const openAccountsBtn = root.querySelector('[data-open-accounts]');
    if (openAccountsBtn) openAccountsBtn.onclick = () => { state.view = 'accounts'; render(); };
    const openCategoriesBtn = root.querySelector('[data-open-categories]');
    if (openCategoriesBtn) openCategoriesBtn.onclick = () => { state.view = 'categories'; render(); };
    const logoutBtn = root.querySelector('[data-logout]');
    if (logoutBtn) logoutBtn.onclick = async () => {
      await clearSession();
      state.adminScope = null;
      state.view = 'types';
      render();
    };
  }

  function renderAccounts() {
    const rows = db.accounts.map(a => `
      <div class="sfi-card" style="cursor:default;">
        <div class="sfi-card-top">
          <div>
            <div class="sfi-card-name">${escapeHtml(a.username)}</div>
            <div class="sfi-card-zone">${a.role === 'admin' ? 'Administrateur — tous les magasins' : escapeHtml(a.magasin || '—')}</div>
            <div class="sfi-card-zone">Code : ${escapeHtml(a.pin)}</div>
          </div>
          ${a.username === state.session.username ? '' : `<button class="sfi-btn ghost" style="flex:none; padding:8px 10px; font-size:11.5px;" data-delete-account="${escapeHtml(a.username)}">Supprimer</button>`}
        </div>

    root.innerHTML = `

  }

        <h3>Nouveau compte</h3>

  function renderCategories() {
    const equipCats = db.types.filter(t => t.category !== 'personnel');
    const persoCats = db.types.filter(t => t.category === 'personnel');

    const row = (t) => {
      const count = t.category === 'personnel'
        ? habCollaboratorsForType(t.label).length
        : db.equipements.filter(e => e.type === t.label).length;
      return `
      <div class="sfi-card" style="cursor:default;">
        <div class="sfi-card-top">
          <div>
            <div class="sfi-card-name">${escapeHtml(t.label)}</div>
            <div class="sfi-card-zone">${formatFreq(t.freq)} · rappel ${t.rappelDefaut || 6} mois avant · ${count} fiche${count > 1 ? 's' : ''}</div>
          </div>
          <div style="display:flex; gap:6px; flex-shrink:0;">
            <button class="sfi-btn ghost" style="padding:8px 10px; font-size:11.5px;" data-edit-category="${escapeHtml(t.label)}">Modifier</button>
            ${count === 0 ? `<button class="sfi-btn ghost" style="padding:8px 10px; font-size:11.5px; color:var(--danger);" data-delete-category="${escapeHtml(t.label)}">Suppr.</button>` : ''}
          </div>

    root.innerHTML = `
      <div class="sfi-detail-header">
        <button class="sfi-back" data-back-to-types>${backIcon()} Retour</button>

        <p>${db.types.length} catégories</p>

      <div class="sfi-list" style="position:relative;">
        <div class="sfi-section-label" style="margin-top:0;">Matériel & installations</div>

        <div class="sfi-section-label">Personnel formé / habilitations</div>

      <button class="sfi-fab" data-new-category title="Ajouter une catégorie">+</button>

    <div class="sfi-overlay" data-close-sheet>

          <label>Nom de la catégorie</label>
          <input type="text" id="cat-label" value="${existing ? escapeHtml(existing.label) : ''}" placeholder="ex : Portail motorisé" ${isNew ? '' : 'data-original-label="' + escapeHtml(existing.label) + '"'} />
        </div>
        <div class="sfi-field">
          <label>Fréquence de contrôle</label>
          <select id="cat-freq">
            ${presets.map(p => `<option value="${p}" ${existing && existing.freq === p ? 'selected' : ''}>${p === 0.25 ? 'Chaque semaine' : (p === 1 ? 'Tous les mois' : 'Tous les ' + p + ' mois')}</option>`).join('')}

        <div class="sfi-field">
          <label>Rappel avant échéance</label>
          <select id="cat-rappel">

            <option value="personnel" ${existing && existing.category === 'personnel' ? 'selected' : ''}>Personnel formé / habilitation</option>

        </div>
        <div class="sfi-sheet-actions">
          <button class="sfi-btn ghost" data-close-sheet>Annuler</button>
          <button class="sfi-btn primary" data-save-category>Enregistrer</button>
        </div>
      </div>
    </div>`;
  }

  function renderTypes() {
    const scopedEquip = db.equipements.filter(e => inScope(e.magasin));
    const overall = {ok:0, warn:0, danger:0};
    scopedEquip.forEach(e => overall[statusOf(e)]++);

    // Recherche globale : si texte saisi, on affiche directement les équipements trouvés
    if (state.typeSearch.trim()) {
      const q = state.typeSearch.toLowerCase();
      const found = scopedEquip.filter(e =>
        (e.nom + e.id + e.zone + e.type).toLowerCase().includes(q));
      const cards = found.length === 0
        ? `<div class="sfi-empty">Aucun résultat pour « ${escapeHtml(state.typeSearch)} ».</div>`
        : found.map(e => equipCardHtml(e)).join('');
      root.innerHTML = `
        ${headerHtml()}
        <div class="sfi-stats">
          <div class="sfi-stat st-ok" data-status-filter="ok"><b>${overall.ok}</b><span>À jour</span></div>
          <div class="sfi-stat st-warn" data-status-filter="warn"><b>${overall.warn}</b><span>À vérifier</span></div>
          <div class="sfi-stat st-danger" data-status-filter="danger"><b>${overall.danger}</b><span>Panne/retard</span></div>
        </div>
        <div class="sfi-search">
          <input type="text" placeholder="Rechercher un équipement, une zone, un type…" value="${escapeHtml(state.typeSearch)}" data-type-search />
        </div>
        <div class="sfi-list" style="position:relative;">${cards}</div>
        <button class="sfi-fab" data-new-equip title="Ajouter un équipement">+</button>
        ${state.sheet === 'add-equip' ? renderAddEquipSheet() : ''}
        ${state.sheet === 'scan' ? renderScanSheet() : ''}
        ${state.toast ? `<div class="sfi-toast">${escapeHtml(state.toast)}</div>` : ''}
      `;
      return;
    }

    const groups = typesWithCounts();
    const equipGroups = groups.filter(t => t.category !== 'personnel');
    const persoGroups = groups.filter(t => t.category === 'personnel');

    const tileHtml = (t) => {
      const worst = t.counts.danger > 0 ? 'danger' : t.counts.warn > 0 ? 'warn' : 'ok';
      const bits = [];
      if (t.counts.danger) bits.push(`<span class="sfi-type-pill st-danger">${t.counts.danger}</span>`);
      if (t.counts.warn) bits.push(`<span class="sfi-type-pill st-warn">${t.counts.warn}</span>`);
      if (t.counts.ok) bits.push(`<span class="sfi-type-pill st-ok">${t.counts.ok}</span>`);
      return `
        <div class="sfi-type-tile" data-open-type="${escapeHtml(t.label)}">
          <div class="sfi-type-bar st-${t.total ? worst : 'empty'}"></div>
          <div class="sfi-type-main">
            <div class="sfi-type-label">${escapeHtml(t.label)}</div>
            <div class="sfi-type-count">${t.total} ${t.total > 1 ? 'éléments' : t.total === 1 ? 'élément' : 'aucun élément'}</div>
          </div>
          <div class="sfi-type-pills">${bits.join('') || (t.total === 0 ? '<span class="sfi-type-pill st-empty">—</span>' : '')}</div>
        </div>`;
    };

    root.innerHTML = `
      ${headerHtml()}
      <div class="sfi-stats">
        <div class="sfi-stat st-ok" data-status-filter="ok"><b>${overall.ok}</b><span>À jour</span></div>
        <div class="sfi-stat st-warn" data-status-filter="warn"><b>${overall.warn}</b><span>À vérifier</span></div>
        <div class="sfi-stat st-danger" data-status-filter="danger"><b>${overall.danger}</b><span>Panne/retard</span></div>
      </div>
      <div class="sfi-search">
        <input type="text" placeholder="Rechercher un équipement, une zone, un type…" value="${escapeHtml(state.typeSearch)}" data-type-search />
      </div>
      <div class="sfi-list" style="position:relative;">
        <div class="sfi-section-label" style="margin-top:0;">Matériel & installations</div>
        ${equipGroups.map(tileHtml).join('')}
        <div class="sfi-section-label">Personnel formé / habilitations</div>
        ${persoGroups.map(tileHtml).join('')}
      </div>
      <button class="sfi-fab" data-new-equip title="Ajouter un équipement">+</button>
      ${state.sheet === 'add-equip' ? renderAddEquipSheet() : ''}
      ${state.sheet === 'scan' ? renderScanSheet() : ''}
      ${state.toast ? `<div class="sfi-toast">${escapeHtml(state.toast)}</div>` : ''}
    `;
  }

  function headerHtml() {
    const isAdmin = state.session.role === 'admin';
    const scopeLabel = isAdmin ? (state.adminScope === 'TOUS' ? 'Tous les magasins' : state.adminScope) : state.session.magasin;
    return `
      <div class="sfi-header">
        <div class="sfi-brand">
          <div class="sfi-brand-mark">${weldomRoofIcon()}</div>
          <div class="sfi-brand-text">
            <h1>Tableau de bord sécurité</h1>
            <p>Weldom · ${escapeHtml(scopeLabel)}</p>
          </div>
        </div>
        <button class="sfi-scan-btn" data-scan>${scanIcon()} Scanner</button>
      </div>
      <div class="sfi-scope-row">
        <span>${escapeHtml(state.session.username)} · ${isAdmin ? 'admin' : 'utilisateur'}</span>
        <span>
          ${isAdmin ? '<button data-change-store style="margin-right:12px;">Changer de magasin</button>' : ''}
          ${isAdmin ? '<button data-open-categories style="margin-right:12px;">Catégories</button>' : ''}
          ${isAdmin ? '<button data-open-accounts style="margin-right:12px;">Comptes</button>' : ''}
          <button data-logout>Déconnexion</button>
        </span>
      </div>`;
  }

  function equipCardHtml(e) {
    const s = statusOf(e);
    const lv = lastVerif(e.id);
    const panneActive = lastPanneOuverte(e.id);
    const now = new Date();

    let dueStr = '—', progressPct = 100, urgencyText = 'Jamais contrôlé';
    if (panneActive) {
      urgencyText = 'Panne signalée';
      progressPct = 100;
    } else if (lv) {
      const due = addFreqPeriod(lv.date, e.freq || 12);
      dueStr = fmtDate(due);
      const elapsedDays = Math.round((now - new Date(lv.date)) / 86400000);
      const totalDays = Math.max((e.freq || 12) * 30, 1);
      progressPct = Math.min(100, Math.max(0, Math.round((elapsedDays / totalDays) * 100)));
      const daysLeft = Math.round((due - now) / 86400000);
      urgencyText = daysLeft < 0 ? `En retard de ${Math.abs(daysLeft)} j` : `Prochain contrôle dans ${daysLeft} j`;
    }

    return `
    <div class="sfi-card" data-open="${e.id}">
      <div class="sfi-card-top">
        <div>
          <div class="sfi-card-id">${e.id}</div>
          <div class="sfi-card-name">${escapeHtml(e.nom)}</div>
          <div class="sfi-card-zone">${escapeHtml(e.zone)} · ${escapeHtml(e.type)}</div>
          ${state.session.role === 'admin' && state.adminScope === 'TOUS' ? `<div class="sfi-store-pill">${escapeHtml(e.magasin || '—')}</div>` : ''}
        </div>
        <div class="sfi-badge st-${s}">${statusLabel(s)}</div>
      </div>
      <div class="sfi-control-block">
        <div class="sfi-control-row"><span>Dernier contrôle</span><b>${lv ? fmtDate(lv.date) : 'Jamais'}</b></div>
        <div class="sfi-control-row"><span>Périodicité</span><b>${formatFreq(e.freq, true)}</b></div>
        <div class="sfi-control-row"><span>Prochain contrôle</span><b>${dueStr}</b></div>
        <div class="sfi-urgency-bar"><div class="sfi-urgency-fill st-${s}" style="width:${progressPct}%"></div></div>
        <div class="sfi-urgency-label st-${s}">${urgencyText}</div>
      </div>
    </div>`;
  }

  function renderList() {
    const typeItems = db.equipements.filter(e => e.type === state.currentType && inScope(e.magasin));
    const counts = {ok:0, warn:0, danger:0};
    typeItems.forEach(e => counts[statusOf(e)]++);

    let filtered = typeItems.filter(e => {
      if (state.tab !== 'tous' && statusOf(e) !== state.tab) return false;
      if (state.search && !(e.nom + e.zone + e.id).toLowerCase().includes(state.search.toLowerCase())) return false;
      return true;
    });
    filtered.sort((a, b) => dueDateMs(a) - dueDateMs(b));

    const cards = filtered.length === 0
      ? `<div class="sfi-empty">Aucun équipement ne correspond.<br>Ajoute-en un avec le bouton +.</div>`
      : (state.session.role === 'admin' && state.adminScope === 'TOUS' ? groupCardsByStore(filtered, e => e.magasin, equipCardHtml) : filtered.map(e => equipCardHtml(e)).join(''));

    root.innerHTML = `
      <div class="sfi-detail-header">
        <button class="sfi-back" data-back-to-types>${backIcon()} Tous les types</button>
        <h2>${escapeHtml(state.currentType)}</h2>
        <p>${typeItems.length} ${typeItems.length > 1 ? 'éléments enregistrés' : 'élément enregistré'}</p>
      </div>

      <div class="sfi-stats">
        <div class="sfi-stat st-ok"><b>${counts.ok}</b><span>À jour</span></div>
        <div class="sfi-stat st-warn"><b>${counts.warn}</b><span>À vérifier</span></div>
        <div class="sfi-stat st-danger"><b>${counts.danger}</b><span>Panne/retard</span></div>
      </div>

      <div class="sfi-tabs">
        ${tabBtn('tous','Tous')}${tabBtn('ok','À jour')}${tabBtn('warn','À vérifier')}${tabBtn('danger','Panne')}
      </div>

      <div class="sfi-search">
        <input type="text" placeholder="Rechercher dans ce type…" value="${escapeHtml(state.search)}" data-search />
      </div>

      <div class="sfi-list" style="position:relative;">
        ${cards}
      </div>
      <button class="sfi-fab" data-new-equip title="Ajouter un équipement">+</button>
      ${state.sheet === 'add-equip' ? renderAddEquipSheet() : ''}
      ${state.sheet === 'scan' ? renderScanSheet() : ''}
      ${state.toast ? `<div class="sfi-toast">${escapeHtml(state.toast)}</div>` : ''}
    `;
  }

  // Vue transverse : tous les équipements (tous types confondus) partageant un même statut
  function renderStatusList() {
    const statusTitles = {ok: 'À jour', warn: 'À vérifier', danger: 'Panne / retard'};
    const items = db.equipements.filter(e => inScope(e.magasin) && statusOf(e) === state.statusFilter);

    let filtered = items.filter(e => {
      if (!state.search) return true;
      const q = state.search.toLowerCase();
      return (e.nom + e.zone + e.id + e.type).toLowerCase().includes(q);
    });
    filtered.sort((a, b) => dueDateMs(a) - dueDateMs(b));

    const cards = filtered.length === 0
      ? `<div class="sfi-empty">Aucun équipement dans cet état.</div>`
      : (state.session.role === 'admin' && state.adminScope === 'TOUS' ? groupCardsByStore(filtered, e => e.magasin, equipCardHtml) : filtered.map(e => equipCardHtml(e)).join(''));

    root.innerHTML = `
      <div class="sfi-detail-header">
        <button class="sfi-back" data-back-to-types>${backIcon()} Retour</button>
        <h2>${statusTitles[state.statusFilter]}</h2>
        <p>${items.length} ${items.length > 1 ? 'équipements' : 'équipement'}, tous types confondus</p>
      </div>

      <div class="sfi-search">
        <input type="text" placeholder="Rechercher un équipement, une zone, un type…" value="${escapeHtml(state.search)}" data-search />
      </div>

  function tabBtn(key, label) {
    return `<div class="sfi-tab ${state.tab===key?'active':''}" data-tab="${key}">${label}</div>`;
  }

  // Regroupe une liste de cartes par magasin (ordre MAGASINS), avec un sous-titre par groupe — utilisé côté admin
  function groupCardsByStore(items, getStore, cardFn) {
    const groups = {};
    items.forEach(it => {
      const m = getStore(it) || 'Non renseigné';
      if (!groups[m]) groups[m] = [];
      groups[m].push(it);
    });
    const order = [...MAGASINS, 'Non renseigné'].filter(m => groups[m]);
    return order.map(m => `
      <div class="sfi-store-heading">
        <span>${escapeHtml(m)}</span>
        <span class="sfi-store-heading-count">${groups[m].length}</span>
      </div>
      ${groups[m].map(cardFn).join('')}
    `).join('');
  }

  function habCardHtml(c) {
    const s = habStatus(c.latest);
    const days = daysUntil(c.latest.dateExpiration);
    const daysLabel = days < 0 ? `Expirée depuis ${Math.abs(days)} j` : `Expire dans ${days} j`;
    return `
    <div class="sfi-card" data-open-collab="${escapeHtml(c.collaborateur)}">
      <div class="sfi-card-top">
        <div>
          <div class="sfi-card-name">${escapeHtml(c.collaborateur)}</div>
          <div class="sfi-card-zone">Obtenue le ${fmtDate(c.latest.dateObtention)} · Expire le ${fmtDate(c.latest.dateExpiration)}</div>
          <div class="sfi-card-zone">${daysLabel} · rappel ${c.latest.rappelMois || 6} mois avant</div>
        </div>
        <div class="sfi-badge st-${s}">${statusLabel(s)}</div>
      </div>
    </div>`;
  }

  function renderHabList() {
    const collabs = habCollaboratorsForType(state.currentType);
    const counts = {ok:0, warn:0, danger:0};
    collabs.forEach(c => counts[habStatus(c.latest)]++);

    let filtered = collabs.filter(c => {
      const s = habStatus(c.latest);
      if (state.tab !== 'tous' && s !== state.tab) return false;
      if (state.search && !c.collaborateur.toLowerCase().includes(state.search.toLowerCase())) return false;
      return true;
    });
    filtered.sort((a, b) => new Date(a.latest.dateExpiration) - new Date(b.latest.dateExpiration));

    const cards = filtered.length === 0
      ? `<div class="sfi-empty">Personne n'est enregistré pour ce type.<br>Ajoute un collaborateur avec le bouton +.</div>`
      : (state.session.role === 'admin' && state.adminScope === 'TOUS' ? groupCardsByStore(filtered, c => c.latest.magasin, habCardHtml) : filtered.map(habCardHtml).join(''));

    root.innerHTML = `
      <div class="sfi-detail-header">
        <button class="sfi-back" data-back-to-types>${backIcon()} Tous les types</button>
        <h2>${escapeHtml(state.currentType)}</h2>
        <p>${collabs.length} ${collabs.length > 1 ? 'collaborateurs enregistrés' : 'collaborateur enregistré'}</p>
      </div>

      <div class="sfi-stats">
        <div class="sfi-stat st-ok"><b>${counts.ok}</b><span>À jour</span></div>
        <div class="sfi-stat st-warn"><b>${counts.warn}</b><span>À renouveler</span></div>
        <div class="sfi-stat st-danger"><b>${counts.danger}</b><span>Expirée</span></div>
      </div>

      <div class="sfi-tabs">
        ${tabBtn('tous','Tous')}${tabBtn('ok','À jour')}${tabBtn('warn','À renouveler')}${tabBtn('danger','Expirée')}
      </div>

      <div class="sfi-search">
        <input type="text" placeholder="Rechercher un collaborateur…" value="${escapeHtml(state.search)}" data-search />
      </div>

      <div class="sfi-list" style="position:relative;">
        ${cards}

      <button class="sfi-fab" data-new-hab title="Ajouter un collaborateur">+</button>
      ${state.sheet === 'add-hab' ? renderAddHabSheet() : ''}

          <label>Ton nom</label>
          <input type="text" id="f-auteur" placeholder="Prénom Nom" />

          <button class="sfi-btn ghost" data-close-sheet>Annuler</button>

  // ---------- Events ----------
  function bindGlobalEvents() {
    root.querySelectorAll('[data-tab]').forEach(el => {
      el.onclick = () => { state.tab = el.getAttribute('data-tab'); render(); };
    });
    const searchInput = root.querySelector('[data-search]');
    if (searchInput) {
      searchInput.oninput = (ev) => { state.search = ev.target.value; render(); searchAfterRender('[data-search]'); };
    }
    const typeSearchInput = root.querySelector('[data-type-search]');
    if (typeSearchInput) {
      typeSearchInput.oninput = (ev) => { state.typeSearch = ev.target.value; render(); searchAfterRender('[data-type-search]'); };
    }
    root.querySelectorAll('[data-open-type]').forEach(el => {
      el.onclick = () => {
        const label = el.getAttribute('data-open-type');
        const t = db.types.find(x => x.label === label);
        state.currentType = label;
        state.view = (t && t.category === 'personnel') ? 'habList' : 'list';
        state.tab = 'tous';
        state.search = '';
        render();
      };
    });
    root.querySelectorAll('[data-open]').forEach(el => {
      el.onclick = () => { state.currentId = el.getAttribute('data-open'); state.view = 'detail'; render(); };
    });
    const backBtn = root.querySelector('[data-back]');
    if (backBtn) backBtn.onclick = () => { state.view = 'list'; state.currentId = null; render(); };
    const backToTypesBtn = root.querySelector('[data-back-to-types]');
    if (backToTypesBtn) backToTypesBtn.onclick = () => { state.view = 'types'; state.currentType = null; state.currentId = null; state.currentCollab = null; state.statusFilter = null; state.search = ''; render(); };
    const statusFilterEls = root.querySelectorAll('[data-status-filter]');
    if (statusFilterEls) statusFilterEls.forEach(el => {
      el.onclick = () => {
        state.statusFilter = el.getAttribute('data-status-filter');
        state.view = 'statusList';
        state.search = '';
        render();
      };
    });
    const logoutBtn = root.querySelector('[data-logout]');
    if (logoutBtn) logoutBtn.onclick = async () => {
      await clearSession();
      state.adminScope = null;
      state.view = 'types';
      state.currentType = null; state.currentId = null; state.currentCollab = null;
      render();
    };
    const changeStoreBtn = root.querySelector('[data-change-store]');
    if (changeStoreBtn) changeStoreBtn.onclick = () => {
      state.adminScope = null;
      state.view = 'types';
      state.currentType = null; state.currentId = null; state.currentCollab = null;
      render();
    };
    const openAccountsBtn = root.querySelector('[data-open-accounts]');
    if (openAccountsBtn) openAccountsBtn.onclick = () => { state.view = 'accounts'; render(); };
    const openCategoriesBtn = root.querySelector('[data-open-categories]');
    if (openCategoriesBtn) openCategoriesBtn.onclick = () => { state.view = 'categories'; render(); };

    const newAccountBtn = root.querySelector('[data-new-account]');
    if (newAccountBtn) newAccountBtn.onclick = () => { state.sheet = 'add-account'; render(); };

    const newCategoryBtn = root.querySelector('[data-new-category]');
    if (newCategoryBtn) newCategoryBtn.onclick = () => { state.sheet = 'add-category'; render(); };
    root.querySelectorAll('[data-edit-category]').forEach(el => {
      el.onclick = () => { state.editingCategoryLabel = el.getAttribute('data-edit-category'); state.sheet = 'edit-category'; render(); };
    });
    const saveCategoryBtn = root.querySelector('[data-save-category]');
    if (saveCategoryBtn) saveCategoryBtn.onclick = async () => {
      const labelInput = root.querySelector('#cat-label');
      const label = labelInput.value.trim();
      const freq = parseFloat(root.querySelector('#cat-freq').value);
      const rappelDefaut = parseInt(root.querySelector('#cat-rappel').value, 10);
      const category = root.querySelector('#cat-category').value;
      const originalLabel = labelInput.getAttribute('data-original-label');
      if (!label) { showToast('Le nom est requis.'); return; }
      if (!originalLabel && db.types.some(t => t.label === label)) { showToast('Cette catégorie existe déjà.'); return; }
      if (originalLabel) {
        const t = db.types.find(x => x.label === originalLabel);
        if (t) {
          t.label = label; t.freq = freq; t.rappelDefaut = rappelDefaut;
          if (originalLabel !== label) {
            db.equipements.forEach(e => { if (e.type === originalLabel) e.type = label; });
            db.habilitations.forEach(h => { if (h.type === originalLabel) h.type = label; });
          }
        }
      } else {
        db.types.push({label, freq, category, rappelDefaut});
      }
      state.sheet = null;
      state.editingCategoryLabel = null;
      await saveDB();
      showToast('Catégorie enregistrée.');
    };
    root.querySelectorAll('[data-delete-category]').forEach(el => {
      el.onclick = () => { state.editingCategoryLabel = el.getAttribute('data-delete-category'); state.sheet = 'confirm-delete-category'; render(); };
    });
    const confirmDeleteCategoryBtn = root.querySelector('[data-confirm-delete-category]');
    if (confirmDeleteCategoryBtn) confirmDeleteCategoryBtn.onclick = async () => {
      db.types = db.types.filter(t => t.label !== state.editingCategoryLabel);
      state.sheet = null;
      state.editingCategoryLabel = null;
      await saveDB();
      showToast('Catégorie supprimée.');
    };

    const roleSelect = root.querySelector('#a-role');
    if (roleSelect) {
      const magField = root.querySelector('#a-magasin-field');
      const toggle = () => { magField.style.display = roleSelect.value === 'admin' ? 'none' : 'block'; };
      roleSelect.onchange = toggle;
      toggle();
    }

    const saveAccountBtn = root.querySelector('[data-save-account]');
    if (saveAccountBtn) saveAccountBtn.onclick = async () => {
      const username = root.querySelector('#a-user').value.trim().toLowerCase();
      const pin = root.querySelector('#a-pin').value.trim();
      const role = root.querySelector('#a-role').value;
      const magasin = role === 'admin' ? null : root.querySelector('#a-magasin').value;
      if (!username || !pin) { showToast('Identifiant et code requis.'); return; }
      if (db.accounts.some(a => a.username === username)) { showToast('Cet identifiant existe déjà.'); return; }
      db.accounts.push({username, pin, role, magasin});
      state.sheet = null;
      await saveDB();
      showToast('Compte créé.');
    };

    root.querySelectorAll('[data-delete-account]').forEach(el => {
      el.onclick = async () => {
        const username = el.getAttribute('data-delete-account');
        db.accounts = db.accounts.filter(a => a.username !== username);
        await saveDB();
        showToast('Compte supprimé.');
      };
    });
    const backToHabListBtn = root.querySelector('[data-back-to-hablist]');
    if (backToHabListBtn) backToHabListBtn.onclick = () => { state.view = 'habList'; state.currentCollab = null; render(); };

    root.querySelectorAll('[data-open-collab]').forEach(el => {
      el.onclick = () => { state.currentCollab = el.getAttribute('data-open-collab'); state.view = 'habDetail'; render(); };
    });

    const newHabBtn = root.querySelector('[data-new-hab]');
    if (newHabBtn) newHabBtn.onclick = () => { state.sheet = 'add-hab'; render(); };

    const saveHabBtn = root.querySelector('[data-save-hab]');
    if (saveHabBtn) saveHabBtn.onclick = async () => {
      const collaborateur = root.querySelector('#h-collab').value.trim();
      const dateObtention = root.querySelector('#h-obtention').value;
      const dateExpiration = root.querySelector('#h-expiration').value;
      const rappelMois = parseInt(root.querySelector('#h-rappel').value, 10);
      const commentaire = root.querySelector('#h-commentaire').value.trim();
      const magasinSel = root.querySelector('#h-magasin');
      const magasin = magasinSel ? magasinSel.value : state.session.magasin;
      if (!collaborateur || !dateObtention || !dateExpiration) { showToast('Nom et dates requis.'); return; }
      db.habilitations.push({
        id: 'h' + Date.now(),
        type: state.currentType,
        collaborateur, magasin, dateObtention, dateExpiration, rappelMois, commentaire,
        auteur: ''
      });
      state.sheet = null;
      await saveDB();
      showToast('Collaborateur ajouté.');
    };

    const renewHabBtn = root.querySelector('[data-renew-hab]');
    if (renewHabBtn) renewHabBtn.onclick = () => { state.sheet = 'renew-hab'; render(); };

    const confirmRenewBtn = root.querySelector('[data-confirm-renew]');
    if (confirmRenewBtn) confirmRenewBtn.onclick = async () => {
      const dateObtention = root.querySelector('#h-obtention').value;
      const dateExpiration = root.querySelector('#h-expiration').value;
      const rappelMois = parseInt(root.querySelector('#h-rappel').value, 10);
      const commentaire = root.querySelector('#h-commentaire').value.trim();
      if (!dateObtention || !dateExpiration) { showToast('Dates requises.'); return; }
      const prev = habHistory(state.currentType, state.currentCollab)[0];
      db.habilitations.push({
        id: 'h' + Date.now(),
        type: state.currentType,
        collaborateur: state.currentCollab,
        magasin: prev ? prev.magasin : state.session.magasin,
        dateObtention, dateExpiration, rappelMois, commentaire,
        auteur: ''
      });
      state.sheet = null;
      await saveDB();
      showToast('Renouvellement enregistré.');
    };

    const editCollabNameBtn = root.querySelector('[data-edit-collab-name]');
    if (editCollabNameBtn) editCollabNameBtn.onclick = () => { state.sheet = 'edit-collab-name'; render(); };
    const saveCollabNameBtn = root.querySelector('[data-save-collab-name]');
    if (saveCollabNameBtn) saveCollabNameBtn.onclick = async () => {
      const newName = root.querySelector('#ec-collab').value.trim();
      if (!newName) { showToast('Le nom est requis.'); return; }
      db.habilitations.forEach(h => {
        if (h.type === state.currentType && h.collaborateur === state.currentCollab) h.collaborateur = newName;
      });
      state.currentCollab = newName;
      state.sheet = null;
      await saveDB();
      showToast('Nom mis à jour.');
    };

    root.querySelectorAll('[data-edit-hab-cycle]').forEach(el => {
      el.onclick = () => { state.editingHistoryId = el.getAttribute('data-edit-hab-cycle'); state.sheet = 'edit-hab-cycle'; render(); };
    });
    const saveHabCycleBtn = root.querySelector('[data-save-hab-cycle]');
    if (saveHabCycleBtn) saveHabCycleBtn.onclick = async () => {
      const dateObtention = root.querySelector('#ehc-obtention').value;
      const dateExpiration = root.querySelector('#ehc-expiration').value;
      const rappelMois = parseInt(root.querySelector('#ehc-rappel').value, 10);
      const commentaire = root.querySelector('#ehc-commentaire').value.trim();
      if (!dateObtention || !dateExpiration) { showToast('Dates requises.'); return; }
      const h = db.habilitations.find(x => x.id === state.editingHistoryId);
      if (h) { h.dateObtention = dateObtention; h.dateExpiration = dateExpiration; h.rappelMois = rappelMois; h.commentaire = commentaire; }
      state.sheet = null;
      state.editingHistoryId = null;
      await saveDB();
      showToast('Cycle mis à jour.');
    };
    const deleteHabCycleBtn = root.querySelector('[data-delete-hab-cycle]');
    if (deleteHabCycleBtn) deleteHabCycleBtn.onclick = async () => {
      const id = deleteHabCycleBtn.getAttribute('data-delete-hab-cycle');
      db.habilitations = db.habilitations.filter(h => h.id !== id);
      state.sheet = null;
      state.editingHistoryId = null;
      await saveDB();
      showToast('Cycle supprimé.');
    };

    const newEquipBtn = root.querySelector('[data-new-equip]');
    if (newEquipBtn) newEquipBtn.onclick = () => { state.sheet = 'add-equip'; render(); };
    const scanBtn = root.querySelector('[data-scan]');
    if (scanBtn) scanBtn.onclick = () => { state.sheet = 'scan'; render(); };

    root.querySelectorAll('[data-close-sheet]').forEach(el => {
      el.onclick = () => { state.sheet = null; render(); };
    });

    const saveEquipBtn = root.querySelector('[data-save-equip]');
    if (saveEquipBtn) saveEquipBtn.onclick = async () => {
      const id = root.querySelector('#f-id').value.trim();
      const nom = root.querySelector('#f-nom').value.trim();
      const type = root.querySelector('#f-type').value;
      const zone = root.querySelector('#f-zone').value;
      const magasinSel = root.querySelector('#f-magasin');
      const magasin = magasinSel ? magasinSel.value : state.session.magasin;
      if (!id || !nom) { showToast('Identifiant et nom requis.'); return; }
      if (db.equipements.some(e => e.id === id)) { showToast('Cet identifiant existe déjà.'); return; }
      db.equipements.push({id, nom, type, zone, magasin, freq: typeFreq(type), rappelMois: typeRappel(type), category: typeCategory(type), createdAt: new Date().toISOString().slice(0,10)});
      state.sheet = null;
      await saveDB();
      showToast('Équipement ajouté.');
    };

    const doScanBtn = root.querySelector('[data-do-scan]');
    if (doScanBtn) doScanBtn.onclick = () => {
      const id = root.querySelector('#f-scan').value.trim();
      const eq = db.equipements.find(e => e.id.toLowerCase() === id.toLowerCase());
      if (!eq) { showToast('Identifiant inconnu.'); return; }
      state.currentId = eq.id;
      state.currentType = eq.type;
      if (state.session.role === 'admin') state.adminScope = eq.magasin;
      state.view = 'detail';
      state.sheet = null;
      render();
    };

    const verifOkBtn = root.querySelector('[data-verif-ok]');
    if (verifOkBtn) verifOkBtn.onclick = () => { pendingPhoto = null; state.sheet = 'verif'; render(); };
    const panneBtn = root.querySelector('[data-panne]');
    if (panneBtn) panneBtn.onclick = () => { pendingPhoto = null; state.sheet = 'panne'; render(); };
    const editFreqBtn = root.querySelector('[data-edit-freq]');
    if (editFreqBtn) editFreqBtn.onclick = () => { state.sheet = 'edit-freq'; render(); };
    const saveFreqBtn = root.querySelector('[data-save-freq]');
    if (saveFreqBtn) saveFreqBtn.onclick = async () => {
      const freq = parseFloat(root.querySelector('#ef-freq').value);
      const rappelMois = parseInt(root.querySelector('#ef-rappel').value, 10);
      const eq = db.equipements.find(x => x.id === state.currentId);
      if (eq) { eq.freq = freq; eq.rappelMois = rappelMois; }
      state.sheet = null;
      await saveDB();
      showToast('Fréquence mise à jour.');
    };

    const editInfoBtn = root.querySelector('[data-edit-info]');
    if (editInfoBtn) editInfoBtn.onclick = () => { state.sheet = 'edit-info'; render(); };
    const saveInfoBtn = root.querySelector('[data-save-info]');
    if (saveInfoBtn) saveInfoBtn.onclick = async () => {
      const nom = root.querySelector('#ei-nom').value.trim();
      const zone = root.querySelector('#ei-zone').value;
      const magasinSel = root.querySelector('#ei-magasin');
      const eq = db.equipements.find(x => x.id === state.currentId);
      if (!nom) { showToast('Le nom est requis.'); return; }
      if (eq) {
        eq.nom = nom;
        eq.zone = zone;
        if (magasinSel) eq.magasin = magasinSel.value;
      }
      state.sheet = null;
      await saveDB();
      showToast('Fiche mise à jour.');
    };

    root.querySelectorAll('[data-edit-history]').forEach(el => {
      el.onclick = () => { state.editingHistoryId = el.getAttribute('data-edit-history'); state.sheet = 'edit-history'; render(); };
    });
    const saveHistoryBtn = root.querySelector('[data-save-history]');
    if (saveHistoryBtn) saveHistoryBtn.onclick = async () => {
      const type = root.querySelector('#eh-type').value;
      const date = root.querySelector('#eh-date').value;
      const commentaire = root.querySelector('#eh-commentaire').value.trim();
      const auteur = root.querySelector('#eh-auteur').value.trim();
      if (!date) { showToast('La date est requise.'); return; }
      const interv = db.interventions.find(i => i.id === state.editingHistoryId);
      if (interv) { interv.type = type; interv.date = date; interv.commentaire = commentaire; interv.auteur = auteur; }
      state.sheet = null;
      state.editingHistoryId = null;
      await saveDB();
      showToast('Entrée mise à jour.');
    };
    const deleteHistoryBtn = root.querySelector('[data-delete-history]');
    if (deleteHistoryBtn) deleteHistoryBtn.onclick = async () => {
      const id = deleteHistoryBtn.getAttribute('data-delete-history');
      db.interventions = db.interventions.filter(i => i.id !== id);
      state.sheet = null;
      state.editingHistoryId = null;
      await saveDB();
      showToast('Entrée supprimée.');
    };

    const handlePhotoFile = async (file) => {
      if (!file) return;
      showToast('Compression de la photo…');
      try {
        pendingPhoto = await compressImage(file);
        render();
      } catch (e) {
        showToast('Photo illisible, réessaie.');
      }
    };
    const cameraInput = root.querySelector('#f-photo-camera');
    if (cameraInput) cameraInput.onchange = () => handlePhotoFile(cameraInput.files[0]);
    const galleryInput = root.querySelector('#f-photo-gallery');
    if (galleryInput) galleryInput.onchange = () => handlePhotoFile(galleryInput.files[0]);
    const takePhotoBtn = root.querySelector('[data-take-photo]');
    if (takePhotoBtn) takePhotoBtn.onclick = () => { if (cameraInput) cameraInput.click(); };
    const choosePhotoBtn = root.querySelector('[data-choose-photo]');
    if (choosePhotoBtn) choosePhotoBtn.onclick = () => { if (galleryInput) galleryInput.click(); };
    const removePhotoBtn = root.querySelector('[data-remove-photo]');
    if (removePhotoBtn) removePhotoBtn.onclick = () => { pendingPhoto = null; render(); };

    root.querySelectorAll('[data-view-photo]').forEach(el => {
      el.onclick = async () => {
        const key = el.getAttribute('data-view-photo');
        lightboxPhoto = 'loading';
        render();
        try {
          const res = await storageAPI.get(key, true);
          lightboxPhoto = (res && res.value) ? res.value : null;
        } catch (e) {
          lightboxPhoto = null;
          showToast('Photo introuvable.');
        }
        render();
      };
    });
    root.querySelectorAll('[data-close-lightbox]').forEach(el => {
      el.onclick = () => { lightboxPhoto = null; render(); };
    });

    const confirmVerifBtn = root.querySelector('[data-confirm-verif]');
    if (confirmVerifBtn) confirmVerifBtn.onclick = async () => {
      const commentaire = root.querySelector('#f-commentaire').value.trim();
      const auteur = root.querySelector('#f-auteur').value.trim();
      const interv = {
        id: 'i' + Date.now(),
        equipementId: state.currentId,
        date: new Date().toISOString().slice(0,10),
        type: 'verif_ok',
        commentaire, auteur
      };
      if (pendingPhoto) {
        interv.photoKey = 'photo-' + interv.id;
        try { await storageAPI.set(interv.photoKey, pendingPhoto, true); } catch (e) { delete interv.photoKey; }
      }
      db.interventions.push(interv);
      pendingPhoto = null;
      state.sheet = null;
      await saveDB();
      showToast('Vérification enregistrée.');
    };

    const confirmPanneBtn = root.querySelector('[data-confirm-panne]');
    if (confirmPanneBtn) confirmPanneBtn.onclick = async () => {
      const commentaire = root.querySelector('#f-commentaire').value.trim();
      const auteur = root.querySelector('#f-auteur').value.trim();
      if (!commentaire) { showToast('Décris la panne.'); return; }
      const interv = {
        id: 'i' + Date.now(),
        equipementId: state.currentId,
        date: new Date().toISOString().slice(0,10),
        type: 'panne',
        commentaire, auteur
      };
      if (pendingPhoto) {
        interv.photoKey = 'photo-' + interv.id;
        try { await storageAPI.set(interv.photoKey, pendingPhoto, true); } catch (e) { delete interv.photoKey; }
      }
      db.interventions.push(interv);
      pendingPhoto = null;
      state.sheet = null;
      await saveDB();
      showToast('Panne signalée.');
    };
  }

  function searchAfterRender(selector) {
    // keep focus on search field after re-render
    requestAnimationFrame(() => {
      const el = root.querySelector(selector);
      if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
    });
  }

  // Deep-link support: ?equip=EXT-01 opens directly the equipment (simule le tap NFC)
  function checkDeepLink() {
    try {
      const params = new URLSearchParams(window.location.search);
      const id = params.get('equip');
      const eq = db.equipements.find(e => e.id === id);
      if (eq) {
        state.currentId = eq.id;
        state.currentType = eq.type;
        if (state.session && state.session.role === 'admin') state.adminScope = eq.magasin;
        state.view = 'detail';
      }
    } catch (e) {}
  }

  loadSession().then(() => {
    loadDB().then(() => { revalidateSession(); checkDeepLink(); render(); });
  });
})();
</script>
